 document.querySelectorAll(".edit-j").forEach(b=>b.onclick=()=>{editingJournal=b.dataset.key;render();$("journal-form").scrollIntoView({behavior:"smooth"})});
 document.querySelectorAll(".go-daily").forEach(b=>b.onclick=()=>{let r=dailyRows().find(x=>String(x.__backendId)===b.dataset.id);if(!r)return;active="Minggu 4";editingDaily=r.__backendId;dailyPhotos=(data(r).photos||[]).map(p=>({...p}));render();$("daily-form").scrollIntoView({behavior:"smooth"})});
 if($("cancel-journal"))$("cancel-journal").onclick=()=>{editingJournal=null;render()};
 document.querySelectorAll(".doc-form").forEach(f=>f.onsubmit=async e=>{e.preventDefault();if(!f.reportValidity())return;let i=Number(f.dataset.stage)-1;await save("doc",i+1,{date:val("doc-date-"+i),note:val("doc-note-"+i)},e.submitter)});
 const inf=$("issue-form");if(inf)inf.onsubmit=async e=>{e.preventDefault();if(!formValid("issue-form"))return;let ok=await save("issue",editingIssue||("i-"+Date.now()+"-"+Math.random().toString(36).slice(2,7)),{problem:val("i-problem"),evidence:val("i-evidence"),cause:val("i-cause"),solution:val("i-solution"),owner:val("i-owner"),status:val("i-status")},e.submitter);if(ok){editingIssue=null;render()}};
 document.querySelectorAll(".edit-i").forEach(b=>b.onclick=()=>{editingIssue=b.dataset.key;render();$("issue-form").scrollIntoView({behavior:"smooth"})});
 if($("cancel-issue"))$("cancel-issue").onclick=()=>{editingIssue=null;render()};
 const gf=$("grade-form");if(gf)gf.onsubmit=async e=>{e.preventDefault();if($("role").value!=="guru")return;let d={};aspects.forEach((_,i)=>d["s"+i]=val("score-"+i));if(await save("grade","main",d,e.submitter))render()};
 const rf=$("report-form");if(rf)rf.onsubmit=async e=>{e.preventDefault();if(!formValid("report-form"))return;let d={};reportFields.forEach((_,i)=>d["f"+i]=val("r-"+i));await save("report","main",d,e.submitter)};
 const ref=$("reflection-form");if(ref)ref.onsubmit=async e=>{e.preventDefault();if(!formValid("reflection-form"))return;let name=val("ref-name"),duplicate=records("reflection").find(r=>data(r).name.toLowerCase()===name.toLowerCase()&&r.record_key!==editingReflection);if(duplicate){message("Inisial tersebut sudah dipakai. Buka entri lama untuk memperbaruinya atau gunakan inisial berbeda.",true);return}let d={name};questions.forEach((_,i)=>d["q"+i]=val("ref-"+i));let ok=await save("reflection",editingReflection||("r-"+Date.now()+"-"+Math.random().toString(36).slice(2,7)),d,e.submitter);if(ok){editingReflection=null;render()}};
 document.querySelectorAll(".edit-r").forEach(b=>b.onclick=()=>{editingReflection=b.dataset.key;render();$("reflection-form").scrollIntoView({behavior:"smooth"})});
 if($("cancel-ref"))$("cancel-ref").onclick=()=>{editingReflection=null;render()};
}
$("open-group").onclick=()=>{let next=val("group").toUpperCase();if(!next){message("Masukkan kode kelompok terlebih dahulu.",true);$("group").focus();return}group=next;$("group").value=next;editingJournal=editingIssue=editingReflection=editingDaily=null;dailyPhotos=[];dailyFilters={group:"",date:"",status:""};message("Menampilkan data kelompok "+group+".");render()};
$("group").addEventListener("keydown",e=>{if(e.key==="Enter")$("open-group").click()});
$("role").onchange=render;
let loadTimer;
const handler={onDataChanged(rows){clearTimeout(loadTimer);backendRecords=rows;ready=true;$("loading").classList.add("hidden");if(!document.activeElement?.closest("form"))render()}};
async function initialize(){
 clearTimeout(loadTimer);$("loading").classList.remove("hidden");$("loading").innerHTML="Memuat data proyek…";
 loadTimer=setTimeout(()=>loadError("Data belum berhasil dimuat."),8000);
 try{const result=await window.dataSdk.init(handler);if(!result.isOk){clearTimeout(loadTimer);loadError("Koneksi data belum berhasil dimulai.")}}
 catch(e){clearTimeout(loadTimer);loadError("Koneksi data belum berhasil dimulai.")}
}
function loadError(text){ready=false;$("loading").classList.remove("hidden");$("loading").innerHTML=esc(text)+' <button id="retry" class="small-btn canva-button" type="button">Coba lagi</button>';$("retry").onclick=initialize}
render();initialize();
</script>
 </body>
</html>
